<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="outer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f7ee"/>
      <stop offset="1" stop-color="#e7ecd9"/>
    </linearGradient>
    <linearGradient id="heart" x1="0.22" y1="0.08" x2="0.78" y2="0.96">
      <stop offset="0" stop-color="#d8e1c9"/>
      <stop offset="0.48" stop-color="#c4d1ad"/>
      <stop offset="1" stop-color="#aeba96"/>
    </linearGradient>
    <filter id="tileShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15" result="blur"/>
      <feOffset in="blur" dx="0" dy="14" result="offset"/>
      <feColorMatrix
        in="offset"
        type="matrix"
        values="0 0 0 0 0.51 0 0 0 0 0.56 0 0 0 0 0.44 0 0 0 0.16 0"
        result="shadow"
      />
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="heartShadow" x="-35%" y="-30%" width="170%" height="185%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="13" result="blur"/>
      <feOffset in="blur" dx="0" dy="17" result="offset"/>
      <feColorMatrix
        in="offset"
        type="matrix"
        values="0 0 0 0 0.46 0 0 0 0 0.51 0 0 0 0 0.39 0 0 0 0.3 0"
        result="shadow"
      />
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="118" fill="url(#outer)"/>
  <rect x="58" y="58" width="396" height="396" rx="108" fill="#fffef9" stroke="#ffffff" stroke-width="14" filter="url(#tileShadow)"/>
  <path
    d="M256 386C225 350 126 296 126 207C126 145 202 114 256 175C310 114 386 145 386 207C386 296 287 350 256 386Z"
    fill="url(#heart)"
    filter="url(#heartShadow)"
  />
</svg>
